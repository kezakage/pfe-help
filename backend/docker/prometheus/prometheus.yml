# Prometheus scrape config — kept short on purpose. Targets resolve over the
# docker-compose network using service names.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Django app — exposes /metrics via django-prometheus
  - job_name: "django"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: "patrimoinehub-web"

  # PostgreSQL — exporter sidecar
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"

  # Redis — exporter sidecar
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

  # Prometheus itself — useful to detect dead scrape targets via `up` metric
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
