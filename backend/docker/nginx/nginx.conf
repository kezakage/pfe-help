# Production nginx config for Patrimoine.dz.
# Terminates TLS, serves /static/ and /media/ directly, reverse-proxies the
# REST API and the WebSocket endpoint to the Daphne process.
#
# For a soutenance demo, a self-signed cert under docker/nginx/certs/ is
# enough; for a real deployment, swap in a Let's Encrypt cert path.

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Upload limit: must match settings.MAX_VIDEO_SIZE (500MB).
    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Map the Upgrade header so WS upgrades work behind the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream daphne {
        server web:8000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # Static + media: served by nginx, no round-trip through Django.
        location /static/ {
            alias /srv/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
        location /media/ {
            alias /srv/media/;
            expires 7d;
            access_log off;
        }

        # WebSocket endpoint for real-time notifications.
        location /ws/ {
            proxy_pass http://daphne;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1d;
        }

        # Everything else: REST API + admin + docs.
        location / {
            proxy_pass http://daphne;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
