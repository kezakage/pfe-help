services:
  db:
    build:
      context: ./docker/postgres
    image: patrimoinehub-postgres:16-3.4-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patrimoinehub}
      POSTGRES_USER: ${POSTGRES_USER:-patrimoine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrimoine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patrimoine} -d ${POSTGRES_DB:-patrimoinehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-patrimoine}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-patrimoine123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-patrimoine} ${AWS_SECRET_ACCESS_KEY:-patrimoine123};
      mc mb -p local/${AWS_STORAGE_BUCKET_NAME:-patrimoinehub-media} || true;
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-patrimoinehub-media} || true;
      exit 0;
      "

  web:
    build: .
    image: patrimoinehub-app:latest
    command: >
      sh -c "python manage.py makemigrations accounts heritage pages media_app discussions exports notifications --noinput &&
             python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 patrimoinehub.asgi:application"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AWS_S3_ENDPOINT_URL: http://minio:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/app
      - mediadata:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  worker:
    image: patrimoinehub-app:latest
    command: celery -A patrimoinehub worker -l info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AWS_S3_ENDPOINT_URL: http://minio:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/app
      - mediadata:/app/media
    depends_on:
      - db
      - redis
      - web

  beat:
    image: patrimoinehub-app:latest
    command: celery -A patrimoinehub beat -l info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - worker

  # ---------------------------------------------------------------------------
  # Observability — Prometheus scrapes Django + exporters; Grafana visualises.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-patrimoine}:${POSTGRES_PASSWORD:-patrimoine}@db:5432/${POSTGRES_DB:-patrimoinehub}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"  # 3000 is taken by the React dev server in some setups
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  mediadata:
  esdata:
  promdata:
  grafanadata:
